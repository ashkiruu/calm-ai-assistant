<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KALMA · Expression preview</title>
  <style>
    :root { color-scheme: dark; font-family: 'Segoe UI', system-ui, sans-serif; background: #101819; color: #e7eff0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, calc(100% - 40px)); margin: 38px auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 500; letter-spacing: .05em; margin: 0 0 5px; }
    p { color: #a6b8ba; font-size: 14px; line-height: 1.5; margin: 0; }
    .tag { font-size: 12px; color: #8ce3f0; white-space: nowrap; }
    #stage { position: relative; width: 100%; aspect-ratio: 1678 / 937; overflow: hidden; background: #cecece; border-radius: 16px; }
    #stage img, #stage svg { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #stage svg { overflow: hidden; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 18px; }
    button { font: inherit; font-size: 13px; border: 1px solid #3b5154; border-radius: 8px; padding: 10px 16px; color: #cbdcde; background: transparent; cursor: pointer; }
    button[aria-pressed="true"] { color: #111e20; background: #8ce3f0; border-color: #8ce3f0; }
    button:hover { border-color: #b2f3f5; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e7b86d; outline-offset: 4px; }
    footer { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid #2a3f42; padding-top: 18px; }
    label { color: #cbdcde; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
    input { accent-color: #8ce3f0; }
    #description { max-width: 620px; min-height: 42px; }
    .note { margin-top: 18px; font-size: 12px; color: #81989b; }
    body.export { background: transparent; }
    body.export main { width: 100%; margin: 0; }
    body.export header, body.export .controls, body.export footer, body.export .note { display: none; }
    body.export #stage { border-radius: 0; }
    @media (max-width: 600px) { main { width: calc(100% - 24px); margin: 24px auto; } header { align-items: flex-start; flex-direction: column; gap: 8px; } button { padding: 9px 12px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>KALMA</h1><p>Your approved companion · expression and animation study</p></div><span class="tag">One body · fixed angle · cyan eyes</span></header>
    <div id="stage" role="img" aria-label="KALMA, ready"><img src="robot-base.png" alt="" draggable="false"><svg id="face" viewBox="0 0 1678 937" aria-hidden="true"></svg></div>
    <nav class="controls" aria-label="Companion expression">
      <button data-state="ready" aria-pressed="true">Ready</button>
      <button data-state="blink" aria-pressed="false">Blink</button>
      <button data-state="listening" aria-pressed="false">Listening</button>
      <button data-state="thinking" aria-pressed="false">Thinking</button>
      <button data-state="speaking" aria-pressed="false">Speaking</button>
      <button data-state="error" aria-pressed="false">Needs attention</button>
      <button data-state="happy" aria-pressed="false">Encouragement</button>
    </nav>
    <footer><p id="description" aria-live="polite"></p><div><label><input id="cycle" type="checkbox">Cycle states</label> <label><input id="pause" type="checkbox">Pause motion</label></div></footer>
    <p class="note">Body, angle, framing and scale stay fixed. Speech rhythm is a visual demonstration. This preview retains the studio background.</p>
  </main>
  <script src="companion.js?v=visor-v2"></script>
</body>
</html>
